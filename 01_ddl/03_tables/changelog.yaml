databaseChangeLog:
  - changeSet:
      id: ddl-tables-001
      author: JUANDAX233
      labels: "HU-FIN-001,ddl,tables"
      comment: "finance_record: income and expenses; the amount is always positive and type gives the sign (DEC-FIN-01)."
      changes:
        - sqlFile:
            path: 001_create_finance_record.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/001_create_finance_record.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-tables-002
      author: JUANDAX233
      labels: "HU-INV-001,ddl,tables"
      comment: "inventory_product: stock as numeric(12,2), never negative; it only changes through movements (DEC-INV-01)."
      changes:
        - sqlFile:
            path: 002_create_inventory_product.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/002_create_inventory_product.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
  - changeSet:
      id: ddl-tables-003
      author: JUANDAX233
      labels: "HU-INV-001,ddl,tables"
      comment: "inventory_movement: the append-only trail of every stock change; it reaches the tenant through its product."
      changes:
        - sqlFile:
            path: 003_create_inventory_movement.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
      rollback:
        - sqlFile:
            path: ../../05_rollbacks/01_ddl/03_tables/003_create_inventory_movement.rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
            stripComments: false
